[package]
name = "intel_crashlog"
version = "1.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = [
    "analysis",
    "control_commands",
    "extraction",
    "embedded_collateral_tree",
    "fs_collateral_tree",
    "serialize",
    "std"
]
analysis = []
collateral_manager = [
    "dep:serde",
    "dep:serde_json"
]
control_commands = [
    "extraction"
]
extraction = [
    "dep:uefi",
    "dep:uefi-raw",
    "dep:windows",
]
embedded_collateral_tree = [
    "collateral_manager"
]
fs_collateral_tree = [
    "collateral_manager",
    "std"
]
ffi = [
    "embedded_collateral_tree",
    "dep:cbindgen"
]
serialize = [
    "dep:serde",
    "dep:serde_json",
]
std = [
    "serde/std",
    "dep:jiff",
    "jiff/std",
    "jiff/tz-system",
    "jiff/tzdb-zoneinfo",
]

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cargo-emit = "0.2"

[dependencies]
uguid = "2"
log = "0.4"

[dependencies.acpi]
version = "5"
default-features = false

[dependencies.jiff]
version = "0.2"
default-features = false
features = ["alloc"]
optional = true

[dependencies.serde]
version = "1"
optional = true
default-features = false
features = [
    "derive"
]

[dependencies.serde_json]
version = "1"
optional = true
default-features = false
features = [
    "alloc"
]

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
optional = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System",
    "Win32_System_EventLog",
    "Win32_System_Time",
]

[target.'cfg(target_os = "uefi")'.dependencies.uefi]
version = "0.37"
optional = true

[target.'cfg(target_os = "uefi")'.dependencies.uefi-raw]
version = "0.14"
optional = true

[build-dependencies.cbindgen]
version = "0.29"
optional = true

[profile.release]
strip = "debuginfo"
